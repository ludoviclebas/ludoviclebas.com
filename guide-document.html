<script>(()=>{const total=34,image=document.querySelector('#guide-page'),viewport=document.querySelector('.document-pages'),selector=document.querySelector('#page-select'),previous=document.querySelector('#previous'),next=document.querySelector('#next');let page=1,zoom=1,fitWidth=0;for(let i=1;i<=total;i++){let opt=document.createElement('option');opt.value=i;opt.textContent=i;selector.append(opt);}function fit(){zoom=1;document.body.classList.remove('zoomed');fitWidth=Math.min(viewport.clientWidth-20,(viewport.clientHeight-20)*794/1123);image.style.width=fitWidth+'px';viewport.scrollTop=0;viewport.scrollLeft=0;}function show(value,updateHash=true){page=Math.max(1,Math.min(total,value));selector.value=page;image.src=([16,32].includes(page)?'guide-gele-20261008-':'guide-sable-20261007-')+String(page).padStart(2,'0')+'.jpg';image.alt='Guide terrain de Ludovic Lebas — page '+page+' sur '+total;previous.disabled=page===1;next.disabled=page===total;fit();if(updateHash)history.replaceState(null,'','#page-'+page);}function setZoom(value){zoom=Math.max(1,Math.min(4,value));if(zoom===1){fit();return;}document.body.classList.add('zoomed');image.style.width=fitWidth*zoom+'px';}function fromHash(){let match=location.hash.match(/^#page-(\d+)$/);show(match?Number(match[1]):1,false);}selector.addEventListener('change',()=>show(Number(selector.value)));previous.addEventListener('click',()=>show(page-1));next.addEventListener('click',()=>show(page+1));document.querySelector('#zoom-in').addEventListener('click',()=>setZoom(zoom+.5));document.querySelector('#zoom-out').addEventListener('click',()=>setZoom(zoom-.5));document.querySelector('#zoom-fit').addEventListener('click',fit);window.addEventListener('resize',()=>{if(zoom===1)fit();});window.addEventListener('hashchange',fromHash);document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(page+1);}if(e.key==='ArrowLeft'||e.key==='P
